<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a9dafa" />
    <meta
      name="description"
      content="A small Three.js scene study for a colorful fantasy life-sim RPG."
    />
    <title>Three.js Valley Prototype</title>
  </head>
  <body>
    <main class="scene-shell" aria-label="Three.js valley scene preview">
      <div class="scene-label" aria-hidden="true">
        <span class="scene-label__eyebrow">FIELD NOTES · 001</span>
        <span class="scene-label__title">A place to begin</span>
      </div>
      <div class="scene-status" aria-hidden="true">
        <span class="scene-status__dot"></span>
        <span>SCENE PREVIEW</span>
      </div>
      <div id="app" class="canvas-host"></div>
      <noscript>This scene needs JavaScript enabled to render.</noscript>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
